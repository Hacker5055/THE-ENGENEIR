name: Android APK

# Builds an installable APK of the native shell (android/) on GitHub's runner,
# which ships the Android SDK. Artifacts are downloadable from the run page.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Server URL baked into the APK (default https://almohandes.edu)"
        required: false
        default: "https://almohandes.edu"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble
        run: |
          gradle -p android assembleDebug --no-daemon \
            -PAM_APP_URL="${{ github.event.inputs.app_url || 'https://almohandes.edu' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-mohandes-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    # Only runs when a keystore is configured in repository secrets.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore (optional)
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — skipping the signed build."
          fi

      - name: Assemble release
        if: steps.keystore.outputs.ready == 'true'
        env:
          AM_KEYSTORE: ${{ runner.temp }}/release.keystore
          AM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon \
            -PAM_APP_URL="${{ github.event.inputs.app_url || 'https://almohandes.edu' }}" \
            -PAM_KEYSTORE="$AM_KEYSTORE" \
            -PAM_KEYSTORE_PASSWORD="$AM_KEYSTORE_PASSWORD" \
            -PAM_KEY_ALIAS="$AM_KEY_ALIAS" \
            -PAM_KEY_PASSWORD="$AM_KEY_PASSWORD"

      - name: Upload release APK
        if: steps.keystore.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: al-mohandes-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
