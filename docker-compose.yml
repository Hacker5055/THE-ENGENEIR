services:
  app:
    build: .
    image: almohandes:latest
    container_name: almohandes
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      AM_DB_PATH: /data/almohandes.db
    ports:
      - "3000:3000"
    volumes:
      - almohandes-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  almohandes-data:
